# The redshift-space run (C_mixed_smooth2ch_depth5_rsd) with strip pooling
# along the line of sight after the bottleneck: features averaged over
# 5 bottleneck cells along z (80 grid cells, 32 h^-1 Mpc), see
# docs/training.md. Everything else, including the seed, matches the
# redshift-space run, so the two can be compared directly.

name: subhalo_C_mixed_smooth2ch_depth5_rsd_stripz
output: /content/drive/MyDrive/deepvoid_runs
seed: 12

data:
  inputs: [tng300-3/subhalos/L3/rsd-z, tng300-3/subhalos/L5/rsd-z,
           tng300-3/subhalos/L7/rsd-z, tng300-3/subhalos/L10/rsd-z]
  labels: tng300-3/mask
  smoothing: {sigma_spacing: 0.5, keep_raw: true}

model:
  depth: 5
  strip_pool: {axes: [z], length: 5}

training:
  epochs: 60
  rotate: z
  val_batches: 16                        # per spacing
  optimizer: {name: adamw, learning_rate: 1.0e-3, weight_decay: 1.0e-3, clipnorm: 1.0}
  loss: {name: scce, class_weights: auto}
  early_stopping: {monitor: val_mcc, patience: 15, min_delta: 0.002}
