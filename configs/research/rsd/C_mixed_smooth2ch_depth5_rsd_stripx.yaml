# Control for C_mixed_smooth2ch_depth5_rsd_stripz: the same strip pooling
# block, but along x, across the line of sight. Same parameter count and
# window length, so if the z run does better than this one, the gain comes
# from the direction of the context, not from the extra parameters.

name: subhalo_C_mixed_smooth2ch_depth5_rsd_stripx
output: /content/drive/MyDrive/deepvoid_runs
seed: 12

data:
  inputs: [tng300-3/subhalos/L3/rsd-z, tng300-3/subhalos/L5/rsd-z,
           tng300-3/subhalos/L7/rsd-z, tng300-3/subhalos/L10/rsd-z]
  labels: tng300-3/mask
  smoothing: {sigma_spacing: 0.5, keep_raw: true}

model:
  depth: 5
  strip_pool: {axes: [x], length: 5}

training:
  epochs: 60
  rotate: z
  val_batches: 16                        # per spacing
  optimizer: {name: adamw, learning_rate: 1.0e-3, weight_decay: 1.0e-3, clipnorm: 1.0}
  loss: {name: scce, class_weights: auto}
  early_stopping: {monitor: val_mcc, patience: 15, min_delta: 0.002}
