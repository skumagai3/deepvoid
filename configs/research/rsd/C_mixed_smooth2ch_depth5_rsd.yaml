# The README model (C_mixed_smooth2ch_depth5) trained on redshift-space
# inputs: subhalo positions moved along z by their peculiar velocities, with
# the real-space T-web labels as the target. Everything matches the
# real-space run except the inputs and the augmentation, which may only use
# the symmetries that keep z as the line of sight.

name: subhalo_C_mixed_smooth2ch_depth5_rsd
output: /content/drive/MyDrive/deepvoid_runs
seed: 12

data:
  inputs: [tng300-3/subhalos/L3/rsd-z, tng300-3/subhalos/L5/rsd-z,
           tng300-3/subhalos/L7/rsd-z, tng300-3/subhalos/L10/rsd-z]
  labels: tng300-3/mask
  smoothing: {sigma_spacing: 0.5, keep_raw: true}

model:
  depth: 5

training:
  epochs: 60
  rotate: z
  val_batches: 16                        # per spacing
  optimizer: {name: adamw, learning_rate: 1.0e-3, weight_decay: 1.0e-3, clipnorm: 1.0}
  loss: {name: scce, class_weights: auto}
  early_stopping: {monitor: val_mcc, patience: 15, min_delta: 0.002}
