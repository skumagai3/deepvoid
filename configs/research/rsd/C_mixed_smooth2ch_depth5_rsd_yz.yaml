# The redshift-space run (C_mixed_smooth2ch_depth5_rsd) trained on two lines
# of sight: z, and y turned onto z (inputs and labels swapped y <-> z when
# loaded, see config.los_swap). The slabs are cut along x, so neither line of
# sight moves tracers between the training, validation and test slabs.
# With rotate: z each line of sight gives 16 orientations, so the two give
# 32 of the cube's 48 (x would give the rest, but it is the split axis).
# Same settings and seed as the z-only run; the test scores of the rsd-z
# inputs compare directly with it.

name: subhalo_C_mixed_smooth2ch_depth5_rsd_yz
output: /content/drive/MyDrive/deepvoid_runs
seed: 12

data:
  inputs: [tng300-3/subhalos/L3/rsd-z, tng300-3/subhalos/L5/rsd-z,
           tng300-3/subhalos/L7/rsd-z, tng300-3/subhalos/L10/rsd-z,
           tng300-3/subhalos/L3/rsd-y, tng300-3/subhalos/L5/rsd-y,
           tng300-3/subhalos/L7/rsd-y, tng300-3/subhalos/L10/rsd-y]
  labels: tng300-3/mask
  smoothing: {sigma_spacing: 0.5, keep_raw: true}

model:
  depth: 5

training:
  epochs: 60
  rotate: z
  val_batches: 16                        # per input
  optimizer: {name: adamw, learning_rate: 1.0e-3, weight_decay: 1.0e-3, clipnorm: 1.0}
  loss: {name: scce, class_weights: auto}
  early_stopping: {monitor: val_mcc, patience: 15, min_delta: 0.002}
