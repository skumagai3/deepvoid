# C_mixed_smooth2ch_unetr with batch 4 in place of 8, for when batch 8 does not
# fit in GPU memory. Steps per epoch are doubled (400), so each epoch still
# draws 1600 training crops, as in the batch-8 run and the U-Net run it is
# compared with; validation batches are doubled too (32), keeping 128
# validation crops per spacing. Each gradient step averages over half as many
# crops, so the steps are noisier; that is a difference from
# C_mixed_smooth2ch_depth5.

name: subhalo_C_mixed_smooth2ch_unetr_b4
output: /content/drive/MyDrive/deepvoid_runs
seed: 12

data:
  inputs: [tng300-3/subhalos/L3, tng300-3/subhalos/L5, tng300-3/subhalos/L7,
           tng300-3/subhalos/L10]
  labels: tng300-3/mask
  smoothing: {sigma_spacing: 0.5, keep_raw: true}

model:
  arch: unetr
  vit: {patch: 8, dim: 240, blocks: 9, heads: 8, mlp_ratio: 4}

training:
  epochs: 60
  batch_size: 4
  steps_per_epoch: 400                   # 4 x 400 = 8 x 200 crops per epoch
  val_batches: 32                        # per spacing; 4 x 32 = 8 x 16 validation crops
  optimizer: {name: adamw, learning_rate: 1.0e-4, weight_decay: 1.0e-3, clipnorm: 1.0}
  loss: {name: scce, class_weights: auto}
  early_stopping: {monitor: val_mcc, patience: 15, min_delta: 0.002}   # as C_mixed_smooth2ch_depth5

evaluate:
  crop: 96
  margin: 24
