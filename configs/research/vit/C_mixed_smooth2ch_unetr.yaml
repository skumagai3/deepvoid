# C_mixed_smooth2ch_depth5 with a vision transformer encoder (UNETR) in place
# of the U-Net encoder. Same data, loss, crops and early stopping, so the two
# compare directly. Differences: the model, a lower learning rate (1e-4, as
# in the UNETR paper; 1e-3 is the U-Net's), and prediction on 96^3 crops,
# since the model has only seen the token positions of a 96^3 crop.
# The 24-cell margin leaves a 48^3 core per crop.

name: subhalo_C_mixed_smooth2ch_unetr
output: /content/drive/MyDrive/deepvoid_runs
seed: 12

data:
  inputs: [tng300-3/subhalos/L3, tng300-3/subhalos/L5, tng300-3/subhalos/L7,
           tng300-3/subhalos/L10]
  labels: tng300-3/mask
  smoothing: {sigma_spacing: 0.5, keep_raw: true}

model:
  arch: unetr
  vit: {patch: 8, dim: 240, blocks: 9, heads: 8, mlp_ratio: 4}

training:
  epochs: 60
  val_batches: 16                        # per spacing
  optimizer: {name: adamw, learning_rate: 1.0e-4, weight_decay: 1.0e-3, clipnorm: 1.0}
  loss: {name: scce, class_weights: auto}
  early_stopping: {monitor: val_mcc, patience: 15, min_delta: 0.002}   # as C_mixed_smooth2ch_depth5

evaluate:
  crop: 96
  margin: 24
