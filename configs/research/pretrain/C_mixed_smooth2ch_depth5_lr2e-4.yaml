# Control for C_mixed_smooth2ch_depth5_dmpre: the same settings, learning
# rate included, but from random weights. dmpre scored below the 1e-3
# from-scratch run (2026-11-23); this run tells whether the lower learning
# rate or the dark-matter start is responsible.

name: subhalo_C_mixed_smooth2ch_depth5_lr2e-4
output: /content/drive/MyDrive/deepvoid_runs
seed: 12

data:
  inputs: [tng300-3/subhalos/L3, tng300-3/subhalos/L5, tng300-3/subhalos/L7,
           tng300-3/subhalos/L10]
  labels: tng300-3/mask
  smoothing: {sigma_spacing: 0.5, keep_raw: true}

model:
  depth: 5

training:
  epochs: 60
  val_batches: 16                        # per spacing
  optimizer: {name: adamw, learning_rate: 2.0e-4, weight_decay: 1.0e-3, clipnorm: 1.0}
  schedule: {name: cosine, warmup_epochs: 1, min_lr_ratio: 0.01}
  loss: {name: scce, class_weights: auto}
  early_stopping: {monitor: val_mcc, patience: 15, min_delta: 0.002}
