# C_mixed_smooth2ch_depth5 trained on V-web labels instead of T-web labels:
# velocity-shear classes (Hoffman et al. 2012) at threshold 0.35 with their
# multiscale correction, from research notebook 20. Everything else matches
# C_mixed_smooth2ch_depth5 (no distillation: its teacher learned T-web labels).
# The question is whether the model recovers this definition from subhalos;
# scores are against V-web labels and are not comparable to the T-web model's.

name: subhalo_C_mixed_smooth2ch_depth5_vweb
output: /content/drive/MyDrive/deepvoid_runs
seed: 12

data:
  inputs: [tng300-3/subhalos/L3, tng300-3/subhalos/L5, tng300-3/subhalos/L7,
           tng300-3/subhalos/L10]
  labels: tng300-3/mask-vweb
  smoothing: {sigma_spacing: 0.5, keep_raw: true}

model:
  depth: 5

training:
  epochs: 60
  val_batches: 16                        # per spacing
  optimizer: {name: adamw, learning_rate: 1.0e-3, weight_decay: 1.0e-3, clipnorm: 1.0}
  loss: {name: scce, class_weights: auto}
  early_stopping: {monitor: val_mcc, patience: 15, min_delta: 0.002}   # as C_mixed_smooth2ch_depth5
