# Split test at spacing 10 h^-1 Mpc (subhalos, raw input), control: the
# four rotations of a region stay together, so no validation region is
# seen in training.
# Everything else matches papersplit_L10_copy.
# Compare validation and test scores across the pair (see src/deepvoid/subcubes.py).

name: papersplit_L10_region
output: /content/drive/MyDrive/deepvoid_runs
seed: 12

data:
  normalization: minmax     # the paper scaled each volume to [0, 1]
  inputs: [tng300-3/subhalos/L10]
  labels: tng300-3/mask
  subcubes: {size: 128, rotations: 4, val_fraction: 0.2, split_by: region,
             holdout: [384, 512], seed: 12}

model:
  depth: 3                 # the paper's best: depth 3, 32 filters
  base_filters: 32

training:
  # Settings of the first paper (dissertation sec. 5.5 and deepvoid_misc
  # DV_MULTI_TRAIN.py), so that this run trains the way those models did:
  # Adam at 3e-4; learning rate x0.25 when the validation loss has not
  # improved for 10 epochs; stop after 25 such epochs, at most 300 epochs;
  # keep the weights with the lowest validation loss. No weight decay,
  # gradient clipping, warm-up or weight averaging.
  batch_size: 4
  epochs: 300
  optimizer: {name: adam, learning_rate: 3.0e-4, clipnorm: null}
  schedule: {name: plateau, factor: 0.25, patience: 10, min_lr: 1.0e-7}
  ema: null
  loss: {name: scce, class_weights: null}
  early_stopping: {monitor: val_loss, patience: 25, min_delta: 0.0}
