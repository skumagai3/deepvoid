# Split test on the full dark-matter density (spacing 0.33 h^-1 Mpc), with
# the first paper's split: each rotated copy is its own example, so the
# rotations of one region can land in both training and validation.
# Everything else matches papersplit_DM_region.
# Compare validation and test scores across the pair (see src/deepvoid/subcubes.py).

name: papersplit_DM_copy
output: /content/drive/MyDrive/deepvoid_runs
seed: 12

data:
  inputs: [tng300-3/dm]
  labels: tng300-3/mask
  subcubes: {size: 128, rotations: 4, val_fraction: 0.2, split_by: copy,
             holdout: [384, 512], seed: 12}

model:
  depth: 3                 # the paper's best: depth 3, 32 filters
  base_filters: 32

training:
  batch_size: 4
  epochs: 150
  # 3e-4 is the paper's learning rate. No weight averaging (the paper had none);
  # with only ~38 steps per epoch the averaged weights lag the trained ones.
  optimizer: {name: adamw, learning_rate: 3.0e-4, weight_decay: 1.0e-4, clipnorm: 1.0}
  ema: null
  loss: {name: scce, class_weights: null}
  early_stopping: {monitor: val_mcc, patience: 15, min_delta: 0.002}
