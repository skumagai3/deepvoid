# C + FiLM + curriculum: as C + FiLM, but early batches favour the denser
# fields. Sampling weights go from 4:3:2:1 (spacing 3:5:7:10) to equal over
# the first 30 epochs. Every spacing is seen throughout; only the mix changes.

name: subhalo_C_film_curriculum
output: /content/drive/MyDrive/deepvoid_runs
seed: 12

data:
  inputs: [tng300-3/subhalos/L3, tng300-3/subhalos/L5, tng300-3/subhalos/L7,
           tng300-3/subhalos/L10]
  labels: tng300-3/mask

model:
  conditioning: {units: 32, noise: 0.1}

training:
  val_batches: 16                        # per spacing
  curriculum: {start: [4, 3, 2, 1], end: [1, 1, 1, 1], epochs: 30}
  loss: {name: scce, class_weights: auto}
  early_stopping: {monitor: val_mcc, patience: 20}
