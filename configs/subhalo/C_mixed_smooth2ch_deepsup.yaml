# C_mixed_smooth2ch with deep supervision: extra outputs at 1/2, 1/4 and 1/8
# resolution, each trained against the class fractions in its blocks, with
# loss weights 1, 1/2, 1/4, 1/8 (normalized). Only the full-resolution
# output is saved for prediction. Everything else matches C_mixed_smooth2ch.

name: subhalo_C_mixed_smooth2ch_deepsup
output: /content/drive/MyDrive/deepvoid_runs
seed: 12

data:
  inputs: [tng300-3/subhalos/L3, tng300-3/subhalos/L5, tng300-3/subhalos/L7,
           tng300-3/subhalos/L10]
  labels: tng300-3/mask
  smoothing: {sigma_spacing: 0.5, keep_raw: true}

model:
  deep_supervision: true

training:
  epochs: 60
  val_batches: 16                        # per spacing
  optimizer: {name: adamw, learning_rate: 1.0e-3, weight_decay: 1.0e-3, clipnorm: 1.0}
  loss: {name: scce, class_weights: auto}
  early_stopping: {monitor: val_mcc, patience: 15, min_delta: 0.002}   # as C_mixed_smooth2ch
