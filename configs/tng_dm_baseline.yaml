# Baseline: TNG300-3-Dark dark-matter density -> T-web classes.
#
# Settings not listed here take the defaults in src/deepvoid/config.py;
# docs/training.md describes each one.

name: tng_dm_baseline
output: /content/drive/MyDrive/deepvoid_runs
seed: 12

data:
  inputs: [tng300-3/dm]          # dataset names from the catalog
  labels: tng300-3/mask
  split:
    fractions: [0.7, 0.15, 0.15]   # train, validation, test slabs
    buffer: 16                     # cells between slabs
    axis: 0

model:
  depth: 4
  base_filters: 16

training:
  crop: 96
  batch_size: 8
  steps_per_epoch: 200
  epochs: 150
  optimizer: {name: adamw, learning_rate: 1.0e-3, weight_decay: 1.0e-4, clipnorm: 1.0}
  schedule: {name: cosine, warmup_epochs: 3, min_lr_ratio: 0.01}
  ema: 0.999
  loss: {name: scce, class_weights: auto}
  early_stopping: {monitor: val_mcc, patience: 15}

evaluate:
  tta: none                      # none, flips (8x slower) or full (48x slower)
