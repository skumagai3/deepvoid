[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepvoid"
version = "0.1.0.dev0"
description = "Semantic segmentation of the cosmic web with 3D U-Nets"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sam Kumagai" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyyaml>=6"]

[project.optional-dependencies]
tf = ["tensorflow>=2.16"]
test = ["pytest>=7"]
figures = ["matplotlib>=3.7"]
viz = ["laspy[lazrs]>=2.4", "h5py", "requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deepvoid = ["catalog.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
