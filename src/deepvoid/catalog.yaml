# Named datasets. Paths are relative to `root`, which DEEPVOID_DATA overrides.
#
# Simulation-level facts live under `simulations`; each dataset adds what is
# specific to its file. Inputs in redshift space (rsd: true) are paired with
# real-space masks: the labels describe the true structure.

root: /content/drive/MyDrive/data

simulations:
  tng300-3:
    sim: TNG300-3-Dark
    box_size: 205.0          # h^-1 Mpc
    snapshot: 99
    redshift: 0.0
  bolshoi:
    sim: Bolshoi
    box_size: 250.0          # h^-1 Mpc
    redshift: 0.0

datasets:
  # ---- TNG300-3-Dark, 512^3 (0.40 h^-1 Mpc cells) ----
  tng300-3/dm:
    file: TNG/DM_DEN_snap99_Nm=512.fvol
    sim: tng300-3
    field: density
    tracer: dm
    spacing: 0.33
  tng300-3/mask:
    file: TNG/TNG300-3-Dark-mask-Nm=512-th=0.65-sig=2.4.fvol
    sim: tng300-3
    field: mask
    threshold: 0.65
    sigma_cells: 2.4         # Gaussian sigma in cells; sigma_eff ~ 1.04 h^-1 Mpc
  tng300-3/mask-vweb:
    # V-web (velocity shear, Hoffman et al. 2012) from the TNG300-3-Dark particles,
    # research notebook 20; threshold 0.35, same smoothing as tng300-3/mask, with
    # Hoffman et al.'s multiscale correction (coarse V-web at sigma_eff = 2 h^-1 Mpc).
    file: TNG/vweb_mask_n512_s2.4_th0.35_ms.npz
    sim: tng300-3
    field: mask
    labels: vweb
    threshold: 0.35
    sigma_cells: 2.4
    multiscale: hoffman2012
  tng300-3/subhalos/L3:
    file: TNG/subs1_mass_Nm512_L3_d_None_smooth.fvol
    sim: tng300-3
    field: density
    tracer: subhalos
    spacing: 3.0
  tng300-3/subhalos/L5:
    file: TNG/subs1_mass_Nm512_L5_d_None_smooth.fvol
    sim: tng300-3
    field: density
    tracer: subhalos
    spacing: 5.0
  tng300-3/subhalos/L7:
    file: TNG/subs1_mass_Nm512_L7_d_None_smooth.fvol
    sim: tng300-3
    field: density
    tracer: subhalos
    spacing: 7.0
  tng300-3/subhalos/L10:
    file: TNG/subs1_mass_Nm512_L10_d_None_smooth.fvol
    sim: tng300-3
    field: density
    tracer: subhalos
    spacing: 10.0
  # ---- TNG300-3-Dark at 256^3 (0.80 h^-1 Mpc cells), from scripts/make_coarse.py ----
  # Inputs are 2x2x2 block means of the 512^3 fields; the mask is recomputed
  # from the 256^3 dark matter with sigma_eff = 1 h^-1 Mpc.
  tng300-3/n256/dm:
    file: TNG/n256/dm_n256.npz
    sim: tng300-3
    field: density
    tracer: dm
    spacing: 0.33
  tng300-3/n256/mask:
    file: TNG/n256/mask_n256_th0.65_seff1.npz
    sim: tng300-3
    field: mask
    threshold: 0.65
  tng300-3/n256/subhalos/L3:
    file: TNG/n256/subhalos_L3_n256.npz
    sim: tng300-3
    field: density
    tracer: subhalos
    spacing: 3.0
  tng300-3/n256/subhalos/L5:
    file: TNG/n256/subhalos_L5_n256.npz
    sim: tng300-3
    field: density
    tracer: subhalos
    spacing: 5.0
  tng300-3/n256/subhalos/L7:
    file: TNG/n256/subhalos_L7_n256.npz
    sim: tng300-3
    field: density
    tracer: subhalos
    spacing: 7.0
  tng300-3/n256/subhalos/L10:
    file: TNG/n256/subhalos_L10_n256.npz
    sim: tng300-3
    field: density
    tracer: subhalos
    spacing: 10.0
  tng300-3/subhalos/L3/rsd:
    file: TNG/subs1_mass_Nm512_L3_RSD.fvol
    sim: tng300-3
    field: density
    tracer: subhalos
    spacing: 3.0
    rsd: true
  tng300-3/subhalos/L5/rsd:
    file: TNG/subs1_mass_Nm512_L5_RSD.fvol
    sim: tng300-3
    field: density
    tracer: subhalos
    spacing: 5.0
    rsd: true
  tng300-3/subhalos/L7/rsd:
    file: TNG/subs1_mass_Nm512_L7_RSD.fvol
    sim: tng300-3
    field: density
    tracer: subhalos
    spacing: 7.0
    rsd: true
  tng300-3/subhalos/L10/rsd:
    file: TNG/subs1_mass_Nm512_L10_RSD.fvol
    sim: tng300-3
    field: density
    tracer: subhalos
    spacing: 10.0
    rsd: true

  # Redshift space along z, made by notebooks/research/13_redshift_space.ipynb
  # from the TNG300-1 subhalo catalog (SubhaloVel), same selection and CIC as above.
  tng300-3/subhalos/L3/rsd-z:
    file: TNG/rsd/subhalos_L3_rsd_z.npz
    sim: tng300-3
    field: density
    tracer: subhalos
    spacing: 3.0
    rsd: true
    los_axis: 2
  tng300-3/subhalos/L5/rsd-z:
    file: TNG/rsd/subhalos_L5_rsd_z.npz
    sim: tng300-3
    field: density
    tracer: subhalos
    spacing: 5.0
    rsd: true
    los_axis: 2
  tng300-3/subhalos/L7/rsd-z:
    file: TNG/rsd/subhalos_L7_rsd_z.npz
    sim: tng300-3
    field: density
    tracer: subhalos
    spacing: 7.0
    rsd: true
    los_axis: 2
  tng300-3/subhalos/L10/rsd-z:
    file: TNG/rsd/subhalos_L10_rsd_z.npz
    sim: tng300-3
    field: density
    tracer: subhalos
    spacing: 10.0
    rsd: true
    los_axis: 2

  # The same with y as the line of sight (notebook 13). Training and scoring
  # swap y and z (inputs and labels) so the line of sight lies along z; y is
  # across the x split, so no tracer moves between slabs.
  tng300-3/subhalos/L3/rsd-y:
    file: TNG/rsd/subhalos_L3_rsd_y.npz
    sim: tng300-3
    field: density
    tracer: subhalos
    spacing: 3.0
    rsd: true
    los_axis: 1
  tng300-3/subhalos/L5/rsd-y:
    file: TNG/rsd/subhalos_L5_rsd_y.npz
    sim: tng300-3
    field: density
    tracer: subhalos
    spacing: 5.0
    rsd: true
    los_axis: 1
  tng300-3/subhalos/L7/rsd-y:
    file: TNG/rsd/subhalos_L7_rsd_y.npz
    sim: tng300-3
    field: density
    tracer: subhalos
    spacing: 7.0
    rsd: true
    los_axis: 1
  tng300-3/subhalos/L10/rsd-y:
    file: TNG/rsd/subhalos_L10_rsd_y.npz
    sim: tng300-3
    field: density
    tracer: subhalos
    spacing: 10.0
    rsd: true
    los_axis: 1

  # ---- Bolshoi, 624^3 (0.401 h^-1 Mpc cells) ----
  # The dissertation-era Bolshoi files are 624^3 grids padded to 640^3 by
  # copying the first 16 cells onto the high end of each axis (found
  # 2026-11-25, notebook research/19: the last 16 slices equal the first 16
  # exactly; read as 640^3, CosmoSim's halos do not line up with them, read
  # as 624^3 they do). `crop: 624` keeps the real grid. Grid point i sits at
  # i x cell. The padded 640^3 reading is kept below as bolshoi/n640-padded/.
  bolshoi/dm:
    file: Bolshoi/Bolshoi_halo_CIC_640_L=0.122.fvol
    crop: 624
    sim: bolshoi
    field: density
    tracer: dm
    spacing: 0.122
  bolshoi/mask:
    file: Bolshoi/bolshoi_mask_tweb_th0.65_seff1_n624.npz
    sim: bolshoi
    field: mask
    threshold: 0.65
    sigma_eff: 1.0           # from bolshoi/dm (624^3) with deepvoid.labels, notebook research/19
  bolshoi/mask-legacy:
    # Mask used in the dissertation, on the padded grid. Agrees with
    # bolshoi/n640-padded/mask on only 88% of voxels (MCC 0.77); built from
    # a density not in the repo (the name mentions 416).
    file: Bolshoi/Bolshoi_bolshoi.delta416_mask_Nm=640_sig=0.916_thresh=0.65.fvol
    crop: 624
    sim: bolshoi
    field: mask
    threshold: 0.65
    sigma_mpc: 0.916
  bolshoi/halos/L3:
    # mass-weighted CIC of the most massive BDM halos (hosts and subhalos);
    # matches CosmoSim's bolshoi.bdmv at z = 0 (correlation 0.9999+)
    file: Bolshoi/Bolshoi_halo_CIC_640_L=3.0.fvol
    crop: 624
    sim: bolshoi
    field: density
    tracer: halos
    spacing: 3.0
  bolshoi/halos/L5:
    # mass-weighted CIC of the most massive BDM halos (hosts and subhalos);
    # matches CosmoSim's bolshoi.bdmv at z = 0 (correlation 0.9999+)
    file: Bolshoi/Bolshoi_halo_CIC_640_L=5.0.fvol
    crop: 624
    sim: bolshoi
    field: density
    tracer: halos
    spacing: 5.0
  bolshoi/halos/L7:
    # mass-weighted CIC of the most massive BDM halos (hosts and subhalos);
    # matches CosmoSim's bolshoi.bdmv at z = 0 (correlation 0.9999+)
    file: Bolshoi/Bolshoi_halo_CIC_640_L=7.0.fvol
    crop: 624
    sim: bolshoi
    field: density
    tracer: halos
    spacing: 7.0
  bolshoi/halos/L10:
    # mass-weighted CIC of the most massive BDM halos (hosts and subhalos);
    # matches CosmoSim's bolshoi.bdmv at z = 0 (correlation 0.9999+)
    file: Bolshoi/Bolshoi_halo_CIC_640_L=10.0.fvol
    crop: 624
    sim: bolshoi
    field: density
    tracer: halos
    spacing: 10.0

  # ---- Bolshoi as stored: 640^3, padded (read as 0.391 h^-1 Mpc cells; for
  # reproducing results made before 2026-11-25 only) ----
  bolshoi/n640-padded/dm:
    file: Bolshoi/Bolshoi_halo_CIC_640_L=0.122.fvol
    sim: bolshoi
    field: density
    tracer: dm
    spacing: 0.122
  bolshoi/n640-padded/mask:
    file: Bolshoi/bolshoi_mask_tweb_th0.65_seff1.npz
    sim: bolshoi
    field: mask
    threshold: 0.65
    sigma_eff: 1.0           # recomputed from the padded grid as if its cells were 0.391 (Nov 2026)
  bolshoi/n640-padded/halos/L3:
    file: Bolshoi/Bolshoi_halo_CIC_640_L=3.0.fvol
    sim: bolshoi
    field: density
    tracer: halos
    spacing: 3.0
  bolshoi/n640-padded/halos/L5:
    file: Bolshoi/Bolshoi_halo_CIC_640_L=5.0.fvol
    sim: bolshoi
    field: density
    tracer: halos
    spacing: 5.0
  bolshoi/n640-padded/halos/L7:
    file: Bolshoi/Bolshoi_halo_CIC_640_L=7.0.fvol
    sim: bolshoi
    field: density
    tracer: halos
    spacing: 7.0
  bolshoi/n640-padded/halos/L10:
    file: Bolshoi/Bolshoi_halo_CIC_640_L=10.0.fvol
    sim: bolshoi
    field: density
    tracer: halos
    spacing: 10.0
